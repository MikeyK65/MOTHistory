<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="splashPlateClip">
      <rect x="48" y="142" width="360" height="92" rx="12"/>
    </clipPath>
  </defs>

  <!-- Drop shadow -->
  <rect x="52" y="148" width="360" height="92" rx="12" fill="#000000" opacity="0.20"/>

  <!-- Yellow plate body -->
  <rect x="48" y="142" width="360" height="92" rx="12" fill="#FFCC00"/>

  <!-- Blue UK country badge -->
  <g clip-path="url(#splashPlateClip)">
    <rect x="48" y="142" width="54" height="92" fill="#003399"/>
  </g>

  <!-- "UK" label in badge -->
  <text x="75" y="194" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">UK</text>

  <!-- "REG TRACE" plate text -->
  <text x="270" y="206" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold"
        fill="#1C1C1E" text-anchor="middle" letter-spacing="6">REG TRACE</text>

  <!-- Plate border -->
  <rect x="48" y="142" width="360" height="92" rx="12" fill="none" stroke="#FFFFFF" stroke-width="5"/>

  <!-- App name -->
  <text x="228" y="292" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Reg Trace UK</text>

  <!-- Tagline -->
  <text x="228" y="332" font-family="Arial, Helvetica, sans-serif" font-size="17"
        fill="#FFFFFF" text-anchor="middle" opacity="0.78" letter-spacing="1">UK vehicle MOT history</text>

  <!-- Decorative rule under tagline -->
  <rect x="164" y="352" width="128" height="3" rx="1.5" fill="#FFFFFF" opacity="0.30"/>
</svg>
