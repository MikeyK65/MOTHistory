<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Clip the badge to the plate's rounded shape so its right edge is straight -->
    <clipPath id="plateClip">
      <rect x="58" y="183" width="340" height="90" rx="12"/>
    </clipPath>
  </defs>

  <!-- Drop shadow -->
  <rect x="62" y="189" width="340" height="90" rx="12" fill="#000000" opacity="0.22"/>

  <!-- Yellow plate body -->
  <rect x="58" y="183" width="340" height="90" rx="12" fill="#FFCC00"/>

  <!-- Blue UK country badge (clipped so right edge is square against yellow) -->
  <g clip-path="url(#plateClip)">
    <rect x="58" y="183" width="52" height="90" fill="#003399"/>
  </g>

  <!-- "UK" label in badge -->
  <text x="84" y="234" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold"
        fill="#FFFFFF" text-anchor="middle">UK</text>

  <!-- "REG" plate text -->
  <text x="256" y="247" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold"
        fill="#1C1C1E" text-anchor="middle" letter-spacing="10">REG</text>

  <!-- Plate border -->
  <rect x="58" y="183" width="340" height="90" rx="12" fill="none" stroke="#FFFFFF" stroke-width="5"/>
</svg>
